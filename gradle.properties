# Скорость сборки: параллельные модули, кэш артефактов (build cache),
# configuration cache (AGP 9.4 + Gradle 9.7 поддерживают полностью),
# daemon (см. build.bat). Heap 3G — R8 на полном Compose-приложении.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
android.enableJetifier=false
